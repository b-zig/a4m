elements:
  - id: infra-router
    type: Device
    name: Edge router
    properties: { technology: OPNsense, ip: 10.0.10.1 }
  - id: infra-switch
    type: Device
    name: Core switch
    properties: { model: 8-port managed PoE }
  - id: infra-net-wan
    type: CommunicationNetwork
    name: Internet (ISP)
  - id: infra-net-lan
    type: CommunicationNetwork
    name: LAN (VLAN 10)
    properties: { vlan: 10, subnet: 10.0.10.0/24 }
  - id: infra-net-iot
    type: CommunicationNetwork
    name: IoT (VLAN 20)
    properties: { vlan: 20, subnet: 10.0.20.0/24 }

relationships:
  - { type: Association, source: infra-router, target: infra-net-wan }
  - { type: Association, source: infra-router, target: infra-net-lan }
  - { type: Association, source: infra-router, target: infra-net-iot }
  - { type: Association, source: infra-switch, target: infra-net-lan }
  - { type: Association, source: infra-switch, target: infra-net-iot }
