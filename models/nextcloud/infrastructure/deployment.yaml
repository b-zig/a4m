# Deployed as images on the shared Docker VM of the compute platform.
elements:
  - id: infra-art-nextcloud
    type: Artifact
    name: nextcloud:29-apache image
  - id: infra-art-mariadb
    type: Artifact
    name: mariadb:11 image
  - id: infra-art-redis
    type: Artifact
    name: redis:7 image

relationships:
  - { type: Assignment, source: compute/infra-docker, target: infra-art-nextcloud }
  - { type: Assignment, source: compute/infra-docker, target: infra-art-mariadb }
  - { type: Assignment, source: compute/infra-docker, target: infra-art-redis }
  - { type: Realization, source: infra-art-nextcloud, target: app-nextcloud-web }
  - { type: Realization, source: infra-art-mariadb, target: app-nextcloud-db }
  - { type: Realization, source: infra-art-redis, target: app-nextcloud-cache }
  - { type: Serving, source: compute/infra-svc-nfs, target: app-nextcloud-web, name: User files volume }
