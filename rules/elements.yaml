# ArchiMate 3.2 element catalogue used by a4m.
# Four layers, quasi-TOGAF, top to bottom: Business, Information (data), Application, Infrastructure.
# Every ArchiMate type maps to one of them:
#   business       <- business, motivation, strategy, implementation & migration
#   information    <- DataObject
#   application    <- application (except DataObject)
#   infrastructure <- technology, physical, Location
#   other          <- Grouping, Junction: connectors, allowed in any layer folder, no id prefix
# layer  -> the folder an element lives in (models/<sa>/<layer>/), its id prefix, view rows and colours
# aspect -> active | behavior | passive | motivation | composite | other (drives Mermaid shapes and in-row ordering)

layers:
  business:       { label: Business,       order: 1, prefix: bus,   color: "#FFFFB5" }
  information:    { label: Information,    order: 2, prefix: data,  color: "#E3D7F4" }
  application:    { label: Application,    order: 3, prefix: app,   color: "#B5FFFF" }
  infrastructure: { label: Infrastructure, order: 4, prefix: infra, color: "#C9E7B7" }
  other:          { label: Other,          order: 5, folder: false, color: "#FFFFFF" }

types:
  # Business: motivation (why)
  Stakeholder:              { layer: business, aspect: motivation }
  Driver:                   { layer: business, aspect: motivation }
  Assessment:               { layer: business, aspect: motivation }
  Goal:                     { layer: business, aspect: motivation }
  Outcome:                  { layer: business, aspect: motivation }
  Principle:                { layer: business, aspect: motivation }
  Requirement:              { layer: business, aspect: motivation }
  Constraint:               { layer: business, aspect: motivation }
  Meaning:                  { layer: business, aspect: motivation }
  Value:                    { layer: business, aspect: motivation }
  # Business: strategy
  Resource:                 { layer: business, aspect: active }
  Capability:               { layer: business, aspect: behavior }
  ValueStream:              { layer: business, aspect: behavior }
  CourseOfAction:           { layer: business, aspect: behavior }
  # Business
  BusinessActor:            { layer: business, aspect: active }
  BusinessRole:             { layer: business, aspect: active }
  BusinessCollaboration:    { layer: business, aspect: active }
  BusinessInterface:        { layer: business, aspect: active }
  BusinessProcess:          { layer: business, aspect: behavior }
  BusinessFunction:         { layer: business, aspect: behavior }
  BusinessInteraction:      { layer: business, aspect: behavior }
  BusinessEvent:            { layer: business, aspect: behavior }
  BusinessService:          { layer: business, aspect: behavior }
  BusinessObject:           { layer: business, aspect: passive }
  Contract:                 { layer: business, aspect: passive }
  Representation:           { layer: business, aspect: passive }
  Product:                  { layer: business, aspect: composite }
  # Application
  ApplicationComponent:     { layer: application, aspect: active }
  ApplicationCollaboration: { layer: application, aspect: active }
  ApplicationInterface:     { layer: application, aspect: active }
  ApplicationFunction:      { layer: application, aspect: behavior }
  ApplicationInteraction:   { layer: application, aspect: behavior }
  ApplicationProcess:       { layer: application, aspect: behavior }
  ApplicationEvent:         { layer: application, aspect: behavior }
  ApplicationService:       { layer: application, aspect: behavior }
  DataObject:               { layer: information, aspect: passive }
  # Infrastructure: technology
  Node:                     { layer: infrastructure, aspect: active }
  Device:                   { layer: infrastructure, aspect: active }
  SystemSoftware:           { layer: infrastructure, aspect: active }
  TechnologyCollaboration:  { layer: infrastructure, aspect: active }
  TechnologyInterface:      { layer: infrastructure, aspect: active }
  Path:                     { layer: infrastructure, aspect: active }
  CommunicationNetwork:     { layer: infrastructure, aspect: active }
  TechnologyFunction:       { layer: infrastructure, aspect: behavior }
  TechnologyProcess:        { layer: infrastructure, aspect: behavior }
  TechnologyInteraction:    { layer: infrastructure, aspect: behavior }
  TechnologyEvent:          { layer: infrastructure, aspect: behavior }
  TechnologyService:        { layer: infrastructure, aspect: behavior }
  Artifact:                 { layer: infrastructure, aspect: passive }
  # Infrastructure: physical
  Equipment:                { layer: infrastructure, aspect: active }
  Facility:                 { layer: infrastructure, aspect: active }
  DistributionNetwork:      { layer: infrastructure, aspect: active }
  Material:                 { layer: infrastructure, aspect: passive }
  # Business: implementation & migration
  WorkPackage:              { layer: business, aspect: behavior }
  ImplementationEvent:      { layer: business, aspect: behavior }
  Deliverable:              { layer: business, aspect: passive }
  Plateau:                  { layer: business, aspect: composite }
  Gap:                      { layer: business, aspect: passive }
  # Other
  Grouping:                 { layer: other, aspect: composite }
  Location:                 { layer: infrastructure, aspect: composite }
  Junction:                 { layer: other, aspect: other }

# OEF viewpoint names Archi understands (org.opengroup.archimate.xmlexchange.XMLTypeMapper).
viewpoints:
  - Organization
  - Information Structure
  - Technology
  - Layered
  - Physical
  - Product
  - Application Structure
  - Application Usage
  - Technology Usage
  - Business Process Cooperation
  - Application Cooperation
  - Service Realization
  - Implementation and Deployment
  - Goal Realization
  - Requirements Realization
  - Motivation
  - Strategy
  - Capability Map
  - Outcome Realization
  - Resource Map
  - Project
  - Migration
  - Implementation and Migration
  - Stakeholder
  - Value Stream
